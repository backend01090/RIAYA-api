<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">RIAYA visit and prescription workflow</title>
  <desc id="desc">Medical Complex Management Backend</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06141f"/>
      <stop offset="0.48" stop-color="#0b1f2a"/>
      <stop offset="1" stop-color="#102c36"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2534"/>
      <stop offset="1" stop-color="#0a1a26"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#32e6c7"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <path d="M0 94 H1280 M0 648 H1280" stroke="#143849" stroke-width="1" opacity="0.75"/>
  <path d="M72 0 V720 M1208 0 V720" stroke="#0f3544" stroke-width="1" opacity="0.35"/>
  <g transform="translate(42 33)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#0d2b39" stroke="#32e6c7" stroke-width="2"/>
    <path d="M24 11 V37 M11 24 H37" stroke="#32e6c7" stroke-width="5" stroke-linecap="round"/>
    <text x="66" y="22" fill="#ffffff" font-size="22" font-weight="900">RIAYA</text>
    <text x="66" y="45" fill="#9eddea" font-size="13" font-weight="600">Medical Complex Management Backend</text>
  </g>
  
  <g filter="url(#soft)">
    <g>
    <rect x="70" y="140" width="235" height="100" rx="10" fill="#0c1d29" stroke="#1f4254" stroke-width="1.2"/>
    <rect x="70" y="140" width="235" height="5" rx="4" fill="#22d3ee" opacity="0.9"/>
    <text x="90" y="174" fill="#ffffff" font-size="18" font-weight="800">Doctor scoped access</text>
