<text x="930" y="220" fill="#c6d8e1" font-size="14" font-weight="500">delete blocked when completed</text>
  </g>
    <path d="M 305 190 L 350 190" stroke="#32e6c7" stroke-width="2.2" fill="none" marker-end="url(#arrow)" opacity="0.9"/> <path d="M 585 190 L 630 190" stroke="#32e6c7" stroke-width="2.2" fill="none" marker-end="url(#arrow)" opacity="0.9"/> <path d="M 865 190 L 910 190" stroke="#32e6c7" stroke-width="2.2" fill="none" marker-end="url(#arrow)" opacity="0.9"/>
    <g>
