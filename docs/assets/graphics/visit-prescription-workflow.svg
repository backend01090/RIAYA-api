<text x="885" y="420" fill="#c6d8e1" font-size="14" font-weight="500">clinical search side channel blocked</text>
  </g>
    <path d="M 745 240 L 365 340" stroke="#32e6c7" stroke-width="2.2" fill="none" marker-end="url(#arrow)" opacity="0.9"/> <path d="M 495 397 L 550 397" stroke="#32e6c7" stroke-width="2.2" fill="none" marker-end="url(#arrow)" opacity="0.9"/> <path d="M 810 397 L 865 397" stroke="#32e6c7" stroke-width="2.2" fill="none" marker-end="url(#arrow)" opacity="0.9"/>
    <rect x="100" y="545" width="1080" height="72" rx="10" fill="#102a38" stroke="#1e5263"/>
    <text x="132" y="575" fill="#ffffff" font-size="18" font-weight="800">Verified clinical boundary</text>
    <text x="132" y="603" fill="#bdeefa" font-size="15" font-weight="600">Admins and doctors can read clinical projections. Receptionists receive operational patient data without symptoms, diagnosis, notes, medication, dosage, or instructions.</text>
