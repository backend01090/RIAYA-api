<text x="90" y="220" fill="#c6d8e1" font-size="14" font-weight="500">other doctors blocked</text>
  </g>
    <g>
    <rect x="350" y="140" width="235" height="100" rx="10" fill="#0c1d29" stroke="#1f4254" stroke-width="1.2"/>
    <rect x="350" y="140" width="235" height="5" rx="4" fill="#34d399" opacity="0.9"/>
    <text x="370" y="174" fill="#ffffff" font-size="18" font-weight="800">Appointment eligibility</text>
    <text x="370" y="198" fill="#c6d8e1" font-size="14" font-weight="500">not pending/cancelled/no-show</text>
<text x="370" y="220" fill="#c6d8e1" font-size="14" font-weight="500">not future, visit unique</text>
  </g>
