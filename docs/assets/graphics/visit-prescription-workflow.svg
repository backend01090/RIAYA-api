    <rect x="630" y="140" width="235" height="5" rx="4" fill="#60a5fa" opacity="0.9"/>
    <text x="650" y="174" fill="#ffffff" font-size="18" font-weight="800">Visit creation</text>
    <text x="650" y="198" fill="#c6d8e1" font-size="14" font-weight="500">symptoms</text>
<text x="650" y="220" fill="#c6d8e1" font-size="14" font-weight="500">diagnosis</text>
<text x="650" y="242" fill="#c6d8e1" font-size="14" font-weight="500">notes</text>
  </g>
    <g>
