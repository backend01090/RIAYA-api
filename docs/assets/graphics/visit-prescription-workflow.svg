    <rect x="550" y="340" width="260" height="5" rx="4" fill="#22d3ee" opacity="0.9"/>
    <text x="570" y="374" fill="#ffffff" font-size="18" font-weight="800">Doctor scope enforced</text>
    <text x="570" y="398" fill="#c6d8e1" font-size="14" font-weight="500">create/update/delete checks</text>
<text x="570" y="420" fill="#c6d8e1" font-size="14" font-weight="500">DoctorPrescriptionMismatch</text>
  </g>
    <g>
    <rect x="865" y="340" width="270" height="115" rx="10" fill="#0c1d29" stroke="#1f4254" stroke-width="1.2"/>
    <rect x="865" y="340" width="270" height="5" rx="4" fill="#f472b6" opacity="0.9"/>
